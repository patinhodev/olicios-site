name: Integração contínua

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend e qualidade
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Configurar Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Validar formatação, referências e segurança básica
        run: npm run check
      - name: Auditar dependências npm
        run: npm audit --audit-level=high

  backend:
    name: Java e Maven
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Configurar Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Compilar e executar testes
        run: mvn --batch-mode --file backend/pom.xml verify

  container:
    name: Imagem Docker
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - name: Baixar código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Construir imagem
        run: docker build --tag olicios-site:ci .
      - name: Validar execução do site
        run: |
          docker run --detach --name olicios-site-ci --publish 8080:8080 olicios-site:ci
          trap 'docker rm --force olicios-site-ci' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8080/ --output index.html; then
              grep --quiet "Restaurante Olicio's" index.html
              exit 0
            fi
            sleep 2
          done
          docker logs olicios-site-ci
          exit 1
      - name: Construir imagem destinada à Vercel
        run: docker build --file Dockerfile.vercel --tag olicios-site:vercel-ci .
      - name: Validar execução da imagem destinada à Vercel
        run: |
          docker run --detach --name olicios-site-vercel-ci --publish 8081:8080 olicios-site:vercel-ci
          trap 'docker rm --force olicios-site-vercel-ci' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8081/ --output index-vercel.html; then
              grep --quiet "Restaurante Olicio's" index-vercel.html
              exit 0
            fi
            sleep 2
          done
          docker logs olicios-site-vercel-ci
          exit 1
